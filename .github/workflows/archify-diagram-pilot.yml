name: Archify diagram review

on:
  pull_request:
    paths:
      - '.agents/skills/archify/**'
      - 'docs/diagrams/archify/**'
      - '.github/workflows/archify-diagram-pilot.yml'
  workflow_dispatch:

# Read-only token; the renderer receives neither a persisted token nor secrets.
permissions:
  contents: read

jobs:
  render-and-validate:
    # PRs from external forks are deliberately not executed: they could modify
    # vendored JavaScript before this workflow runs.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARCHIFY_UPDATE_CHECK_DISABLED: '1'
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Report renderer version
        run: node --version && node .agents/skills/archify/bin/archify.mjs doctor
      - name: Generate and finalize current Tropos architecture
        run: >
          node .agents/skills/archify/bin/archify.mjs
          finalize dataflow
          docs/diagrams/archify/candidate.json
          docs/diagrams/archify/tropos-platform.html
          --repo-root .
          --quality showcase
          --json
      - name: Upload generated diagram and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tropos-archify-platform
          retention-days: 7
          path: |
            docs/diagrams/archify/candidate.json
            docs/diagrams/archify/tropos-platform.html
            docs/diagrams/archify/*finalize*.json
            docs/diagrams/archify/*delivery*.json
            docs/diagrams/archify/*browser-check*.json
          if-no-files-found: warn
