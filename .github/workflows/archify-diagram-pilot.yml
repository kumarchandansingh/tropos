name: Archify diagram pilot

on:
  pull_request:
    paths:
      - '.agents/skills/archify/**'
      - 'docs/diagrams/archify/**'
      - '.github/workflows/archify-diagram-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-and-validate:
    # Do not execute modified vendored JS from fork-authored PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARCHIFY_UPDATE_CHECK_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # Prevent the checkout token from remaining in .git/config when Archify executes.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Report renderer version
        run: node --version && node .agents/skills/archify/bin/archify.mjs doctor
      - name: Generate and finalize source-backed dataflow
        run: >
          node .agents/skills/archify/bin/archify.mjs
          finalize dataflow
          docs/diagrams/archify/candidate.json
          docs/diagrams/archify/tropos-ingestion.html
          --repo-root .
          --quality showcase
          --json
      - name: Upload generated diagram and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tropos-archify-ingestion
          retention-days: 7
          path: |
            docs/diagrams/archify/candidate.json
            docs/diagrams/archify/tropos-ingestion.html
            docs/diagrams/archify/*finalize*.json
            docs/diagrams/archify/*delivery*.json
            docs/diagrams/archify/*browser-check*.json
          if-no-files-found: warn
