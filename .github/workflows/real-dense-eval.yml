name: Real dense model evaluation

on:
  push:
    branches:
      - eval/real-dense-model

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install sentence-transformers scikit-learn
      - run: python scripts/eval_real_dense_model.py
