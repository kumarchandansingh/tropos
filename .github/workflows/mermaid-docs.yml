name: Documentation diagrams

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/validate_mermaid.mjs"
      - ".github/workflows/mermaid-docs.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/validate_mermaid.mjs"
      - ".github/workflows/mermaid-docs.yml"

jobs:
  mermaid:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Mermaid parser
        run: npm install --no-save mermaid@11.12.0
      - name: Validate Mermaid syntax
        run: node scripts/validate_mermaid.mjs
