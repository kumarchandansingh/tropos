name: Retrieval regression gate

on:
  pull_request:
    paths:
      - "apps/api/src/tropos/core/**"
      - "apps/api/src/tropos/evals/**"
      - "apps/api/evals/retrieval/**"
      - "apps/api/scripts/evaluate_retrieval_catalogue_experiment.py"
      - "apps/api/scripts/compare_retrieval_experiments.py"
      - "apps/api/pyproject.toml"
      - "apps/api/uv.lock"
      - ".github/workflows/retrieval-regression-gate.yml"

permissions:
  contents: read

jobs:
  compare-base-to-head:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install Python
        run: uv python install 3.14

      - name: Prepare candidate environment
        working-directory: apps/api
        run: uv sync --dev --locked

      - name: Run candidate generic retrieval experiment
        working-directory: apps/api
        run: |
          RUN_DIR="$RUNNER_TEMP/tropos-retrieval-gate"
          mkdir -p "$RUN_DIR"
          cp evals/retrieval/catalogue_v2.json "$RUN_DIR/catalogue_v2.json"
          uv run python scripts/evaluate_retrieval_catalogue_experiment.py \
            --dataset "$RUN_DIR/catalogue_v2.json" \
            --database "$RUN_DIR/candidate-experiments.sqlite" \
            --lockfile uv.lock \
            --output "$RUN_DIR/candidate.json"

      - name: Run baseline generic retrieval experiment
        run: |
          RUN_DIR="$RUNNER_TEMP/tropos-retrieval-gate"
          BASE_DIR="$RUNNER_TEMP/tropos-baseline"
          git worktree add --detach "$BASE_DIR" "$BASE_SHA"
          cd "$BASE_DIR/apps/api"
          uv sync --dev --locked
          uv run python scripts/evaluate_retrieval_catalogue_experiment.py \
            --dataset "$RUN_DIR/catalogue_v2.json" \
            --database "$RUN_DIR/baseline-experiments.sqlite" \
            --lockfile uv.lock \
            --output "$RUN_DIR/baseline.json"

      - name: Enforce baseline-versus-candidate gate
        working-directory: apps/api
        run: |
          RUN_DIR="$RUNNER_TEMP/tropos-retrieval-gate"
          uv run python scripts/compare_retrieval_experiments.py \
            --baseline "$RUN_DIR/baseline.json" \
            --candidate "$RUN_DIR/candidate.json" \
            --output "$RUN_DIR/gate.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-regression-evidence
          path: ${{ runner.temp }}/tropos-retrieval-gate
          if-no-files-found: warn
