name: Auto-format Python

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: autoformat-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: >
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install Python
        run: uv python install 3.14

      - name: Sync API dependencies
        working-directory: apps/api
        run: uv sync --dev --locked

      - name: Apply Ruff autofixes and formatting
        working-directory: apps/api
        run: |
          uv run ruff check --fix .
          uv run ruff format .

      - name: Commit formatting changes
        run: |
          if git diff --quiet -- apps/api; then
            echo "No formatting changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api
          git commit -m "style: auto-format Python"
          git pull --rebase origin "${{ github.event.pull_request.head.ref }}"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
