[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "katharo"
version = "0.1.0"
description = "Local file review, exact duplicate detection, and reversible quarantine"
requires-python = ">=3.12"
dependencies = ["pypdf>=5,<7"]

[project.optional-dependencies]
dev = ["ruff>=0.11", "mypy>=1.15", "build>=1.2"]

[project.scripts]
katharo = "katharo.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
katharo = ["web/*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
