# OBS-102A: vendor-neutral local OTLP receiver.
# Deliberately no Splunk, Grafana, Jaeger or cloud endpoint.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch: {}
exporters:
  debug:
    verbosity: detailed
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
